name: Patch terminal feedback loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update explanation flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          g = Path('grader.js')
          s = g.read_text()

          s = s.replace(
              "else paint('good','<b>✓ Correct — terminal task complete.</b> Now explain in your own words what happened and why. Your explanation will be compared with a detailed model explanation.');",
              "else { paint('good','<b>✓ Correct — terminal task complete.</b> The detailed explanation is shown below.'); showLabExplanation(); }"
          )

          s = s.replace(
              "const oldPractice=practice;\n  practice=function(){resetGrader();oldPractice();setTimeout(resetGrader,0)};",
              "const oldPractice=practice;\n  practice=function(){resetGrader();oldPractice();setTimeout(()=>{resetGrader();const e=document.getElementById('explain');if(e)e.style.display='none';[...document.querySelectorAll('button')].forEach(b=>{if(b.textContent.trim()==='Check & continue')b.style.display='none'})},0)};"
          )

          pattern = r"  // Require the learner's explanation, then provide a full model explanation instead of immediately moving on\..*?window\.nextMixedLab=function\(\)\{labI\+\+;practice\(\)\};"
          replacement = '''  function showLabExplanation(){
            const l=currentLab();
            const m=document.getElementById('labmsg');
            if(m)m.innerHTML=`<div class="notice" style="line-height:1.65"><b>Detailed explanation</b><p>${labDetail(l)}</p><p><b>Expected command sequence:</b> <code>${h(l[2])}</code></p><button class="btn primary" onclick="nextMixedLab()">Next hands-on task</button></div>`;
          }
          window.showLabExplanation=showLabExplanation;

          finishLab=function(){
            if(typeof page!=='undefined'&&page==='practice'&&!labDone){const m=document.getElementById('labmsg');if(m)m.innerHTML='<p style="color:var(--red)"><b>Complete the terminal task correctly first.</b></p>';paint('bad','<b>✗ Terminal task incomplete.</b> Finish the required command sequence first.');return}
            showLabExplanation();
          };
          window.finishLab=finishLab;
          window.nextMixedLab=function(){labI++;practice()};'''
          s = re.sub(pattern, replacement, s, flags=re.S)
          g.write_text(s)

          p = Path('index.html')
          html = p.read_text()
          tag = '<script src="grader.js?v=7"></script>'
          html = re.sub(r'<script src="grader\.js\?v=\d+"></script>', tag, html)
          if tag not in html:
              html = html.replace('</body>', tag + '\n</body>')
          p.write_text(html)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grader.js index.html
          git commit -m "[study-flow] Explain automatically after correct answer"
          git push
