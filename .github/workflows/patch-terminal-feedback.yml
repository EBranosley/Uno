name: Patch terminal feedback loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inject grader script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="grader.js?v=3"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[terminal-feedback] Enable live terminal grading"
          git push
