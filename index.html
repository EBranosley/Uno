function home(){let done=Object.keys(S.done).length;V.innerHTML=`<div class="grid g2"><div class="card"><div class="muted">Objective mastery</div><div class="stat">${done}/19</div><div class="bar"><div class="fill" style="width:${pct(done,19)}%"></div></div></div><div class="card"><div class="muted">Reviews due</div><div class="stat">${due()}</div><button class="btn primary" onclick="go('cards')">Start review</button></div></div><div class="card"><h2>Today’s study loop</h2><p class="muted">Recall → Execute → Inspect → Explain → Review</p><div class="row"><button class="btn primary" onclick="go('practice')">Start mixed practice</button><button class="btn" onclick="go('term')">Open terminal lab</button></div></div><div class="card"><h3>All 5 Topics</h3>${[1,2,3,4,5].map(t=>`<div style="margin:12px 0"><div class="space"><span>Topic ${t}</span><b>${topicPct(t)}%</b></div><div class="bar"><div class="fill" style="width:${topicPct(t)}%"></div></div></div>`).join('')}</div><div class="notice small">Progress is stored in your browser on this device. Use Progress → Export Backup before clearing Safari data or switching devices.</div>`}

function practice(){let l=LAB[labI%LAB.length],q=Q[qI%Q.length];V.innerHTML=`<h2>Mixed practice</h2><div class="card"><span class="pill">Objective ${l[0]}</span><h3>Hands-on task</h3><p>${l[1]}</p><p class="muted small">Do it in the terminal below from memory. Use man if you are stuck.</p>${terminalBox('labterm')}<textarea id="explain" class="answer" placeholder="Explain what happened and why..."></textarea><div class="row" style="margin-top:9px"><button class="btn primary" onclick="finishLab()">Check & continue</button><button class="btn" onclick="showLabHint()">Show expected commands</button></div><div id="labmsg"></div></div><div class="card"><span class="pill">Objective ${q[3]}</span><h3>Exam-style question</h3><p>${q[0]}</p>${q[1].map(c=>`<button class="btn choice" onclick="answerQ(this,'${esc(c).replace(/'/g,"&#39;")}')">${esc(c)}</button>`).join('')}<div id="qmsg"></div></div>`;setTimeout(bindTerm,0)}function showLabHint(){document.getElementById('labmsg').innerHTML=`<div class="notice mono">${esc(LAB[labI%LAB.length][2])}</div>`}function finishLab(){let l=LAB[labI%LAB.length],e=document.getElementById('explain').value.trim();if(e.length<8){document.getElementById('labmsg').innerHTML='<p style="color:var(--amber)">Add a short explanation first.</p>';return}S.labs[l[0]+'-'+labI]=1;S.done[l[0]]=1;save();document.getElementById('labmsg').innerHTML=`<div class="notice"><b>Model explanation:</b> ${esc(l[3])}</div>`;labI++;setTimeout(practice,1000)}function answerQ(el,a){let q=Q[qI%Q.length],ok=a===q[2];S.quiz.total++;if(ok){S.quiz.right++;S.done[q[3]]=1}else S.mistakes.push({q:q[0],a,correct:q[2],when:Date.now()});save();document.querySelectorAll('.choice').forEach(b=>b.disabled=true);el.classList.add(ok?'right':'wrong');document.getElementById('qmsg').innerHTML=`<p style="color:${ok?'var(--green)':'var(--red)'}"><b>${ok?'Correct':'Correct answer: '+esc(q[2])}</b></p>`;qI++;setTimeout(practice,900)}window.showLabHint=showLabHint;window.finishLab=finishLab;window.answerQ=answerQ;
function cards(){let dueIdx=F.map((_,i)=>i).filter(i=>!S.cards[i]||S.cards[i].due<=Date.now());if(!dueIdx.length)dueIdx=F.map((_,i)=>i);cardI=dueIdx[cardI%dueIdx.length];let f=F[cardI];V.innerHTML=`<h2>Spaced repetition</h2><div class="card"><div class="space"><span class="pill">Objective ${f[2]}</span><span class="muted small">${due()} due</span></div><div class="flash" onclick="flipCard()">${flip?esc(f[1]):esc(f[0])}</div><p class="muted small" style="text-align:center">Tap card to flip</p>${flip?`<div class="row" style="justify-content:center"><button class="btn danger" onclick="rate(0)">Again</button><button class="btn" onclick="rate(1)">Hard</button><button class="btn primary" onclick="rate(2)">Good</button><button class="btn" onclick="rate(3)">Easy</button></div>`:''}</div>`}function flipCard(){flip=!flip;cards()}function rate(r){let x=S.cards[cardI]||{int:0,ease:2.5};let days=[0,1,3,7][r];if(r===0){x.int=0;x.ease=Math.max(1.3,x.ease-.2)}else{x.int=x.int?Math.max(days,Math.round(x.int*(r===1?1.2:r===2?x.ease:x.ease+1))):days;x.ease=Math.max(1.3,x.ease+(r===3?.15:r===1?-.1:0))}x.due=Date.now()+x.int*86400000;S.cards[cardI]=x;save();flip=false;cardI++;cards()}window.flipCard=flipCard;window.rate=rate;
function terminalBox(){return `<div class="term" id="termout">${termOut.map(esc).join('\n')}</div><input id="termin" class="termInput" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="student@lpi-lab:${cwd}$">`}function term(){V.innerHTML=`<h2>Terminal lab</h2><div class="card"><p class="muted">Safe simulated Linux environment. Try commands from memory; use <span class="mono">man ls</span> or <span class="mono">help</span>.</p>${terminalBox()}<div class="row" style="margin-top:10px"><button class="btn" onclick="runLine('pwd')">pwd</button><button class="btn" onclick="runLine('ls -la')">ls -la</button><button class="btn" onclick="runLine('ps')">ps</button><button class="btn" onclick="runLine('ip addr show')">ip addr</button></div></div>`;setTimeout(bindTerm,0)}function bindTerm(){let i=document.getElementById('termin');if(!i)return;i.onkeydown=e=>{if(e.key==='Enter'){runLine(i.value);i.value=''}}}function norm(p){if(p==='~')return'/home/student';if(p.startsWith('/'))return p;return(cwd==='/'?'':cwd)+'/'+p}function runLine(line){if(!line.trim())return;let parts=line.trim().split(/\s*;\s*/),all=[];for(let c of parts)all.push(exec(c.trim()));termOut.push(`student@lpi-lab:${cwd}$ ${line}`,...all.filter(Boolean));termOut=termOut.slice(-80);let o=document.getElementById('termout');if(o){o.textContent=termOut.join('\n');o.scrollTop=o.scrollHeight}}function exec(c){let a=c.split(/\s+/),cmd=a[0];if(cmd==='help')return'Commands: pwd cd ls mkdir touch echo cat grep head tail wc chmod chown ln ps top free dmesg journalctl ip ping host dig ss useradd groupadd userdel groupdel passwd man info clear';if(cmd==='clear'){termOut=[];return''}if(cmd==='pwd')return cwd;if(cmd==='cd'){let p=norm(a[1]||'~');cwd=p;return''}if(cmd==='mkdir'){let p=a.includes('-p')?a[a.length-1]:a[1];fs[norm(p)]={};return''}if(cmd==='touch'){a.slice(1).forEach(x=>fs[norm(x)]='');return''}if(cmd==='ls'){let keys=Object.keys(fs).filter(k=>k.startsWith(cwd==='/'?'/':cwd+'/')&&k!==cwd);let names=[...new Set(keys.map(k=>k.slice((cwd==='/'?1:cwd.length+1)).split('/')[0]))];return(a.some(x=>x.includes('a'))?'.  ..  ':'')+names.join('  ')}if(cmd==='echo'){let m=c.match(/echo\s+(.+?)(\s*(>>|>)\s*(\S+))?$/);if(!m)return'';let txt=m[1].replace(/^['"]|['"]$/g,'').replace(/\$(\w+)/g,(_,v)=>localStorage.getItem('var_'+v)||'');if(m[3]){let p=norm(m[4]);fs[p]=m[3]==='>>'?(fs[p]||'')+txt+'\n':txt+'\n';return''}return txt}if(c.includes('=')&&!c.startsWith('=')){let [k,...v]=c.split('=');localStorage.setItem('var_'+k,v.join('='));return''}if(cmd==='export'){let s=a[1]||'';if(s.includes('=')){let[k,v]=s.split('=');localStorage.setItem('var_'+k,v)}return''}if(cmd==='cat')return fs[norm(a[1])]??`cat: ${a[1]}: No such file`;if(cmd==='grep'){let pat=a[1]?.replace(/^['"]|['"]$/g,''),f=fs[norm(a[2])]||'';return f.split('\n').filter(x=>x.includes(pat)).join('\n')}if(cmd==='ps')return'PID PPID CMD\n1 0 init\n421 1 bash\n508 421 ps';if(cmd==='top')return'top - simulated live process view\nPID USER CPU MEM COMMAND\n421 student 0.1 0.4 bash';if(cmd==='free')return'              total   used   free\nMem:          2048M   850M   1198M';if(cmd==='dmesg')return'[0.000] Linux kernel initialized\n[1.420] ens33: link up';if(cmd==='journalctl')return'Sep 14 systemd: Started session\nSep 14 sshd: listening on port 22';if(cmd==='ip')return'1: lo  inet 127.0.0.1/8\n2: ens33  inet 192.168.10.10/24';if(cmd==='ping')return`PING ${a[1]||'host'}: 64 bytes: time=1.2 ms`;if(cmd==='host'||cmd==='dig')return`${a[1]||'example.com'} has address 93.184.216.34`;if(cmd==='ss')return'State Recv-Q Send-Q Local Address:Port Peer Address:Port\nESTAB 0 0 192.168.10.10:49152 93.184.216.34:443';if(cmd==='chmod'||cmd==='chown'||cmd==='useradd'||cmd==='groupadd'||cmd==='userdel'||cmd==='groupdel'||cmd==='passwd'||cmd==='ln')return`${cmd}: simulated successfully`;if(cmd==='man'||cmd==='info')return`${cmd.toUpperCase()} ${a.slice(1).join(' ')}\nStudy the NAME, SYNOPSIS, DESCRIPTION and OPTIONS sections. This simulator provides concise practice help.`;return`${cmd}: command not implemented in simulator`}window.runLine=runLine;
function progress(){let done=Object.keys(S.done).length;V.innerHTML=`<h2>Progress & backup</h2><div class="grid g2"><div class="card"><div class="muted">Objectives reviewed</div><div class="stat">${done}/19</div></div><div class="card"><div class="muted">Practice accuracy</div><div class="stat">${S.quiz.total?pct(S.quiz.right,S.quiz.total):0}%</div><div class="small muted">${S.quiz.right}/${S.quiz.total} correct</div></div></div>${[1,2,3,4,5].map(t=>`<div class="card"><div class="space"><b>Topic ${t}</b><b>${topicPct(t)}%</b></div><div class="bar"><div class="fill" style="width:${topicPct(t)}%"></div></div></div>`).join('')}<div class="card"><h3>Mistake notebook</h3>${S.mistakes.length?S.mistakes.slice(-10).reverse().map(m=>`<p><b>${esc(m.q)}</b><br><span class="muted">Your answer: ${esc(m.a)} • Correct: ${esc(m.correct)}</span></p>`).join(''):'<p class="muted">No recorded mistakes yet.</p>'}</div><div class="card"><h3>Backup</h3><div class="row"><button class="btn primary" onclick="backup()">Export Backup</button><label class="btn">Import Backup<input type="file" accept="application/json" style="display:none" onchange="restore(event)"></label><button class="btn danger" onclick="resetAll()">Reset Progress</button></div></div>`}function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='lpi-lab-progress.json';a.click();URL.revokeObjectURL(u)}function restore(e){let f=e.target.files[0],r=new FileReader;r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Progress restored')}catch{alert('Invalid backup file')}};r.readAsText(f)}function resetAll(){if(confirm('Reset all saved progress on this device?')){localStorage.removeItem(K);location.reload()}}window.backup=backup;window.restore=restore;window.resetAll=resetAll;
function render(){nav();if(page==='home')home();else if(page==='curr')curr();else if(page==='practice')practice();else if(page==='cards')cards();else if(page==='term')term();else progress()}render();
</script><script src="grader.js?v=7"></script>
